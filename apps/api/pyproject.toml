[project]
name = "signbridge-api"
version = "0.1.0"
description = "SignBridge AI backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "tensorflow>=2.16",
    "joblib>=1.3",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]